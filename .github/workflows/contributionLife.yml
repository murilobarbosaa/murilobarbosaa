name: generate contribution life

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate game of life svgs
        uses: satomasahiro2005/contribution-life@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          out_dir: dist

      - name: push svgs to the output-life branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-life
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
