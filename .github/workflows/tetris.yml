name: generate tetris

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate tetris svg
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: tetromino
          tetromino_count: "5"
          palette: auto
          output_path: dist/tetris.svg

      - name: push svg to the output-tetris branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-tetris
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
