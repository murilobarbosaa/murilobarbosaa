name: generate game of life board

on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate game of life board svgs
        uses: HibikiHata/game-of-life-svg@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist

      - name: push svgs to the output-gol branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-gol
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
