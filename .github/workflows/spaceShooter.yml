name: generate space shooter

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install gh-space-shooter
        run: pip install gh-space-shooter

      - name: generate space shooter gif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh-space-shooter "${{ github.repository_owner }}" --output dist/space-shooter.gif --strategy random --fps 25

      - name: push gif to the output-space-shooter branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-space-shooter
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
